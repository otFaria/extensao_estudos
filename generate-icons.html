<!DOCTYPE html>
<html>
<head><title>Gerador de Ícones — StudyMind AI</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:40px;">
  <h1>🧠 StudyMind AI — Gerador de Ícones</h1>
  <p>Clique no botão abaixo para gerar e baixar os ícones.</p>
  <button id="generate" style="padding:12px 24px;background:#6366f1;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer;margin:20px 0;">
    Gerar Ícones
  </button>
  <div id="preview" style="display:flex;gap:20px;margin-top:20px;align-items:end;"></div>

  <script>
    document.getElementById("generate").addEventListener("click", () => {
      const sizes = [16, 48, 128];
      const preview = document.getElementById("preview");
      preview.innerHTML = "";

      sizes.forEach(size => {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");

        // Background gradient
        const gradient = ctx.createLinearGradient(0, 0, size, size);
        gradient.addColorStop(0, "#6366f1");
        gradient.addColorStop(1, "#8b5cf6");

        // Rounded rect
        const r = size * 0.2;
        ctx.beginPath();
        ctx.moveTo(r, 0);
        ctx.lineTo(size - r, 0);
        ctx.quadraticCurveTo(size, 0, size, r);
        ctx.lineTo(size, size - r);
        ctx.quadraticCurveTo(size, size, size - r, size);
        ctx.lineTo(r, size);
        ctx.quadraticCurveTo(0, size, 0, size - r);
        ctx.lineTo(0, r);
        ctx.quadraticCurveTo(0, 0, r, 0);
        ctx.closePath();
        ctx.fillStyle = gradient;
        ctx.fill();

        // Shadow glow
        ctx.shadowColor = "rgba(99, 102, 241, 0.6)";
        ctx.shadowBlur = size * 0.15;

        // Brain emoji
        ctx.font = `${size * 0.55}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("🧠", size / 2, size / 2 + size * 0.03);

        // Preview
        const container = document.createElement("div");
        container.style.textAlign = "center";
        container.appendChild(canvas);
        const label = document.createElement("p");
        label.textContent = `${size}x${size}`;
        label.style.fontSize = "12px";
        label.style.marginTop = "8px";
        container.appendChild(label);
        preview.appendChild(container);

        // Download
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `icon${size}.png`;
          a.click();
          URL.revokeObjectURL(url);
        });
      });
    });
  </script>
</body>
</html>
